  <!-- Google Fonts: BBH Bartle (display), Inter (body), Share Tech Mono (accent/pixel) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    rel="stylesheet" />

  <style>
    /* =========================================================
       CSS CUSTOM PROPERTIES — Brand Tokens
    ========================================================= */
    :root {
      --color-black: #121212;
      --color-white: #ffffff;
      --color-accent: #58C6C3;
      --color-accent2: #C35881;
      --color-accent3: #58C69B;
      --color-muted: rgba(255, 255, 255, 0.38);

      --font-display: 'BBH Bartle', sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'Share Tech Mono', 'Courier New', monospace;

      --logo-margin: 40px;
      --logo-padding: 15px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100dvh;
      background-color: var(--color-black);
      color: var(--color-white);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(88, 198, 195, 0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .motif {
      position: fixed;
      pointer-events: none;
      z-index: 1;
    }

    /* Motif positions & dimensions matching SVG aspect ratios - organically scattered to look random without overlapping center content or each other */
    .motif-v1 {
      top: clamp(40px, 6dvh, 80px);
      left: clamp(30px, 4vw, 70px);
      width: 48px;
      height: 96px;
    }

    .motif-v2 {
      bottom: clamp(60px, 8dvh, 120px);
      right: clamp(20px, 3vw, 50px);
      width: 180px;
      height: 90px;
    }

    .motif-v3 {
      top: clamp(250px, 35dvh, 350px);
      right: clamp(20px, 3vw, 50px);
      width: 100px;
      height: 111px;
    }

    .motif-v4 {
      top: clamp(420px, 60dvh, 500px);
      right: clamp(40px, 5vw, 90px);
      width: 60px;
      height: 60px;
    }

    .motif-v5 {
      bottom: clamp(250px, 35dvh, 350px);
      left: clamp(20px, 3vw, 50px);
      width: 75px;
      height: 100px;
    }

    .motif-v6 {
      top: 50%;
      left: 50%;
      width: clamp(180px, 20vw, 360px);
      height: clamp(720px, 80vw, 1440px);
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    /* Self-draw pixel-by-pixel animation system */
    .motif path {
      opacity: 0;
      animation: pixelDraw 8s ease-in-out infinite both;
    }

    @keyframes pixelDraw {
      0%   { opacity: 0; }
      2%   { opacity: 0.95; } /* bright flash */
      8%   { opacity: 0.20; } /* settle to dim brand glow */
      60%  { opacity: 0.20; } /* hold visibility */
      75%  { opacity: 0; }    /* fade out */
      100% { opacity: 0; }
    }

    /* Staggered delay classes for up to 35 paths */
    .motif path:nth-child(1) { animation-delay: 0.10s; }
    .motif path:nth-child(2) { animation-delay: 0.20s; }
    .motif path:nth-child(3) { animation-delay: 0.30s; }
    .motif path:nth-child(4) { animation-delay: 0.40s; }
    .motif path:nth-child(5) { animation-delay: 0.50s; }
    .motif path:nth-child(6) { animation-delay: 0.60s; }
    .motif path:nth-child(7) { animation-delay: 0.70s; }
    .motif path:nth-child(8) { animation-delay: 0.80s; }
    .motif path:nth-child(9) { animation-delay: 0.90s; }
    .motif path:nth-child(10) { animation-delay: 1.00s; }
    .motif path:nth-child(11) { animation-delay: 1.10s; }
    .motif path:nth-child(12) { animation-delay: 1.20s; }
    .motif path:nth-child(13) { animation-delay: 1.30s; }
    .motif path:nth-child(14) { animation-delay: 1.40s; }
    .motif path:nth-child(15) { animation-delay: 1.50s; }
    .motif path:nth-child(16) { animation-delay: 1.60s; }
    .motif path:nth-child(17) { animation-delay: 1.70s; }
    .motif path:nth-child(18) { animation-delay: 1.80s; }
    .motif path:nth-child(19) { animation-delay: 1.90s; }
    .motif path:nth-child(20) { animation-delay: 2.00s; }
    .motif path:nth-child(21) { animation-delay: 2.10s; }
    .motif path:nth-child(22) { animation-delay: 2.20s; }
    .motif path:nth-child(23) { animation-delay: 2.30s; }
    .motif path:nth-child(24) { animation-delay: 2.40s; }
    .motif path:nth-child(25) { animation-delay: 2.50s; }
    .motif path:nth-child(26) { animation-delay: 2.60s; }
    .motif path:nth-child(27) { animation-delay: 2.70s; }
    .motif path:nth-child(28) { animation-delay: 2.80s; }
    .motif path:nth-child(29) { animation-delay: 2.90s; }
    .motif path:nth-child(30) { animation-delay: 3.00s; }
    .motif path:nth-child(31) { animation-delay: 3.10s; }
    .motif path:nth-child(32) { animation-delay: 3.20s; }
    .motif path:nth-child(33) { animation-delay: 3.30s; }
    .motif path:nth-child(34) { animation-delay: 3.40s; }
    .motif path:nth-child(35) { animation-delay: 3.50s; }

    .page {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 40px 24px;
      gap: 0;
    }

    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin: var(--logo-margin) 0;
    }

    .logo-mark-wrap {
      padding: var(--logo-padding);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(88, 198, 195, 0.15);
      border-radius: 18px;
      background: radial-gradient(ellipse at 50% 30%, rgba(88, 198, 195, 0.06) 0%, transparent 70%);
      margin-bottom: 28px;
      transition: box-shadow 0.4s ease;
    }

    .logo-mark-wrap:hover {
      box-shadow: 0 0 40px rgba(88, 198, 195, 0.18);
    }

    #logo-mark {
      width: 120px;
      height: 176px;
      overflow: visible;
      display: block;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .wordmark-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 5rem);
      letter-spacing: 0.06em;
      color: var(--color-white);
      line-height: 1;
      text-transform: uppercase;
    }

    .wordmark-sub {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(0.7rem, 2vw, 0.95rem);
      letter-spacing: 0.28em;
      color: var(--color-accent);
      text-transform: uppercase;
    }

    .badge-wrap {
      margin-top: 44px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coming-soon-badge {
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 2.2vw, 0.9rem);
      letter-spacing: 0.30em;
      color: var(--color-black);
      background: var(--color-accent);
      padding: 7px 18px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: badgeGlow 2.8s ease-in-out infinite;
      will-change: box-shadow;
    }

    #badge-text {
      display: inline;
      white-space: nowrap;
    }

    #badge-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--color-black);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 0.9s step-end infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    @keyframes badgeGlow {

      0%,
      100% {
        box-shadow: 0 0 0px rgba(88, 198, 195, 0);
      }

      50% {
        box-shadow: 0 0 22px rgba(88, 198, 195, 0.55), 0 0 6px rgba(88, 198, 195, 0.3);
      }
    }

    .tagline {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      color: rgba(255, 255, 255, 0.70);
      letter-spacing: 0.02em;
      text-align: center;
      max-width: 420px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--color-accent);
      margin: 36px 0;
      border-radius: 2px;
      opacity: 0.5;
    }

    .social-row {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: var(--color-muted);
      transition: color 0.25s ease, border-color 0.25s ease, transform 0.22s ease, box-shadow 0.25s ease;
    }

    .social-link svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-link:hover {
      color: var(--color-accent);
      border-color: rgba(88, 198, 195, 0.45);
      transform: translateY(-3px);
      box-shadow: 0 6px 22px rgba(88, 198, 195, 0.18);
    }

    .footer-note {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.18);
      white-space: nowrap;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .motif-v3, .motif-v4 {
        display: none;
      }

      .motif-v6 {
        width: clamp(100px, 18vw, 180px);
        height: clamp(400px, 72vw, 720px);
      }
    }

    @media (max-width: 480px) {
      .motif-v5 {
        display: none;
      }

      .motif-v6 {
        width: 80px;
        height: 320px;
      }

      .motif-v1 {
        width: 32px;
        height: 64px;
        top: 15px;
        left: 15px;
      }

      .motif-v2 {
        width: 60px;
        height: 30px;
        bottom: 15px;
        right: 15px;
      }

      #logo-mark {
        width: 88px;
        height: 129px;
      }

      .logo-mark-wrap {
        margin-bottom: 20px;
      }

      .social-row {
        gap: 18px;
      }

      .social-link {
        width: 38px;
        height: 38px;
      }

      .footer-note {
        font-size: 0.55rem;
      }
    }

    .page>* {
      animation: fadeUp 0.7s ease both;
    }

    .logo-section {
      animation-delay: 0.05s;
    }

    .badge-wrap {
      animation-delay: 0.25s;
    }

    .tagline {
      animation-delay: 0.38s;
    }

    .divider {
      animation-delay: 0.50s;
    }

    .social-row {
      animation-delay: 0.62s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';
      var BADGE_TEXT = 'COMING SOON';
      var REVEAL_DELAY = 680;
      var CHAR_DELAY = 72;
      var textEl = document.getElementById('badge-text');
      var cursorEl = document.getElementById('badge-cursor');
      if (!textEl || !cursorEl) return;
      var charIndex = 0;
      function revealNextChar() {
        if (charIndex < BADGE_TEXT.length) {
          textEl.textContent += BADGE_TEXT[charIndex];
          charIndex++;
          setTimeout(revealNextChar, CHAR_DELAY);
        }
      }
      setTimeout(revealNextChar, REVEAL_DELAY);
      var badgeEl = document.querySelector('[role="status"]');
      if (badgeEl) badgeEl.setAttribute('aria-label', BADGE_TEXT);
    })();
  </script>
