<?xml version="1.0" encoding="utf-8"?><svg width="2500" height="1200" viewBox="-365 40 2500 1200" fill="none" xmlns="http://www.w3.org/2000/svg"><style>.m{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.dx{animation-name:dx}
.dd{animation-name:drift}
.tw{animation-name:twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.rise{animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite}
.bf{animation-name:bfade;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes dx{from{transform:translateX(calc(var(--a)*-1))}to{transform:translateX(var(--a))}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--x),var(--y))}}
@keyframes twinkle{from{opacity:.08}to{opacity:.55}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(var(--rise))}}
@keyframes bfade{0%{opacity:0}10%{opacity:.9}85%{opacity:.9}100%{opacity:0}}
