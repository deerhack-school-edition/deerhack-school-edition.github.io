<?xml version="1.0" encoding="utf-8"?><svg width="912" height="1930" viewBox="0 0 912 1930" fill="none" xmlns="http://www.w3.org/2000/svg"><style>.m{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.dx{animation-name:dx}
.dd{animation-name:drift}
.tw{animation-name:twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.rise{animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite}
.bf{animation-name:bfade;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes dx{from{transform:translateX(calc(var(--a)*-1))}to{transform:translateX(var(--a))}}
